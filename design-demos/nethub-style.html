*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--paper)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.shell{max-width:1180px;margin:0 auto;padding:44px 40px 80px}
h1{font:700 26px/1.25 var(--sans);letter-spacing:-.01em}
.lede{max-width:760px;font-size:14px;line-height:1.75;color:var(--ink-2);margin-top:10px}
.controls{position:sticky;top:0;z-index:50;margin:24px -40px 0;padding:11px 40px;background:rgba(238,240,242,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.ctl{display:flex;align-items:center;gap:9px}
.ctl>span{font:600 12px var(--sans);color:var(--ink-3)}
.pick{display:inline-flex;background:#E2E5E9;border:1px solid var(--rule);border-radius:8px;padding:2px}
.pick button{font:500 13px var(--sans);color:var(--ink-2);padding:6px 11px;border-radius:6px;white-space:nowrap}
.pick button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pick button:focus-visible{outline:2px solid #0A84FF;outline-offset:1px}
.vnote{margin-top:22px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;max-width:900px}
.vnote b{font-size:16px}
.vnote p{font-size:14px;line-height:1.7;color:var(--ink-2)}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px}
.cap{font:600 12px var(--sans);color:var(--ink-3);margin-bottom:9px}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(0,0,0,.16);box-shadow:0 30px 60px -32px rgba(20,30,50,.45);height:640px;transition:height .2s}
.wall{position:absolute;inset:0;background:radial-gradient(120% 80% at 8% 0%,#C9DDF2 0%,transparent 55%),radial-gradient(90% 70% at 100% 35%,#E7D3C6 0%,transparent 60%),radial-gradient(80% 60% at 25% 100%,#CFE3D8 0%,transparent 60%),#D5D9E0}
.dark .wall{background:radial-gradient(120% 80% at 8% 0%,#22344F 0%,transparent 55%),radial-gradient(90% 70% at 100% 35%,#3F2C2A 0%,transparent 60%),radial-gradient(80% 60% at 25% 100%,#1D3A33 0%,transparent 60%),#15171C}

/* ───────── 菜单栏 ───────── */
.menubar{position:absolute;top:0;left:0;right:0;height:24px;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 10px;
  background:rgba(246,246,246,.62);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  color:#111;font:500 13px var(--sans);--fg:#111}
.dark .menubar{background:rgba(28,28,30,.5);color:#F2F2F2;--fg:#F2F2F2}
.mb{height:22px;display:flex;align-items:center;padding:0 7px;border-radius:5px;white-space:nowrap;opacity:.92}
.mb.cs{gap:4px;cursor:pointer}
.mb.cs.active{background:rgba(0,0,0,.12)}
.dark .mb.cs.active{background:rgba(255,255,255,.18)}
.tray{width:16px;height:16px;background:var(--fg);-webkit-mask:var(--tray) center/contain no-repeat;mask:var(--tray) center/contain no-repeat;flex:none}
.mbpct{font:500 12px var(--sans);font-variant-numeric:tabular-nums}
.mb.cs.warn .mbpct{color:#E38A00}.dark .mb.cs.warn .mbpct{color:#FFB340}
.mb.cs.bad .mbpct{color:#E5372C}.dark .mb.cs.bad .mbpct{color:#FF6961}
.wifi{width:15px;height:11px}

/* ───────── 面板（照 NetHub 的 token） ───────── */
.panel{position:absolute;top:30px;right:10px;width:320px;border-radius:12px;overflow:hidden;
  background:rgba(244,244,246,.80);backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);
  box-shadow:0 0 0 .5px rgba(0,0,0,.22),0 18px 50px -10px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.55);
  color:#1d1d1f;font:12px/1.35 var(--sans);
  --t2:rgba(0,0,0,.56);--t3:rgba(0,0,0,.42);--sep:rgba(0,0,0,.085);--hover:rgba(0,0,0,.05);--card:rgba(255,255,255,.6);--accent:#0A84FF;
  --ok:#2FB350;--warn:#E38A00;--bad:#E5372C;--off:rgba(0,0,0,.3);--track:rgba(0,0,0,.07)}
.dark .panel{background:rgba(38,38,42,.78);color:#F2F2F7;box-shadow:0 0 0 .5px rgba(0,0,0,.6),0 18px 50px -10px rgba(0,0,0,.6),inset 0 0 0 .5px rgba(255,255,255,.12);
  --t2:rgba(255,255,255,.62);--t3:rgba(255,255,255,.45);--sep:rgba(255,255,255,.085);--hover:rgba(255,255,255,.07);--card:rgba(255,255,255,.06);
  --ok:#32D74B;--warn:#FFB340;--bad:#FF6961;--off:rgba(255,255,255,.32);--track:rgba(255,255,255,.1)}
.num{font-variant-numeric:tabular-nums}
.hair{height:.5px;background:var(--sep);margin:0 12px}
.cardbg{background:var(--card);box-shadow:0 0 0 .5px var(--sep)}

/* 头部 */
.hd{padding:12px 14px 8px;display:flex;align-items:center;gap:8px}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--sans);color:#fff;flex:none}
.hd .nm{font:600 13px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag{font:600 9.5px var(--sans);padding:1.5px 5px;border-radius:4px;color:var(--t2);background:var(--card);box-shadow:0 0 0 .5px var(--sep);white-space:nowrap}
.tag.w{color:var(--warn)}
.st{margin-left:auto;display:flex;align-items:center;gap:4px;font:600 10.5px var(--sans);white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;display:block}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-off{color:var(--t3)}
.b-ok{background:var(--ok)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}.b-off{background:var(--off)}

/* 数据条 */
.stats{display:grid;margin:0 10px;border-radius:8px}
.stats>div{padding:6px 9px;min-width:0}
.stats>div+div{border-left:.5px solid var(--sep)}
.k{font:500 9.5px var(--sans);color:var(--t3);white-space:nowrap}
.v{font:500 11.5px var(--sans);font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap}

/* 用量卡 */
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 10px 2px}
.uc{border-radius:9px;padding:7px 9px 8px}
.uc .top{display:flex;justify-content:space-between;align-items:baseline}
.lab{font:600 10px var(--sans);color:var(--t3)}
.val{font:600 12.5px var(--sans);font-variant-numeric:tabular-nums}
.val small{font:500 9.5px var(--sans);color:var(--t2);margin-left:1px}
.bar{position:relative;height:5px;border-radius:3px;background:var(--track);margin-top:7px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar>u{position:absolute;top:-3px;bottom:-3px;width:1.5px;border-radius:1px;background:var(--t2)}
.uc .foot{font:500 9.5px var(--sans);color:var(--t2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 行 */
.row{display:flex;align-items:center;gap:9px;padding:6px 10px;margin:2px 4px;border-radius:7px;cursor:pointer}
.row:hover{background:var(--hover)}
.row .ic{width:18px;display:grid;place-items:center;flex:none;color:var(--t2)}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:500;font-size:12px}
.row .sub{font-size:10.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chev{width:6px;height:6px;border-right:1.4px solid var(--t3);border-bottom:1.4px solid var(--t3);transform:rotate(-45deg);margin-right:4px;flex:none}
.sw{width:26px;height:15px;border-radius:99px;background:var(--off);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:1.5px;left:1.5px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 .5px 1px rgba(0,0,0,.25)}
.sw.on{background:var(--accent)}.sw.on::after{left:12.5px}

/* 表 */
.th{display:grid;padding:8px 14px 3px;font:600 10px var(--sans);color:var(--t3)}
.th span:not(:first-child),.tr span:not(:first-child){text-align:right}
.tr{display:grid;align-items:center;padding:4px 10px;margin:0 4px;border-radius:6px;font-size:11.5px;font-variant-numeric:tabular-nums}
.tr:hover{background:var(--hover)}
.tr .u{font-size:9.5px;color:var(--t2)}
.tr .dim{color:var(--t2)}
.tr.cur{background:var(--accent);color:#fff}
.tr.cur .dim,.tr.cur .u{color:rgba(255,255,255,.8)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.mini .bar{width:34px;margin:0;height:4px}
.tr.cur .mini .bar{background:rgba(255,255,255,.3)}
.tr.cur .mini .bar>i{background:#fff!important}

/* 图 */
.map{position:relative;margin:6px 10px 4px;height:138px;border-radius:10px;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.ml{position:absolute;font:600 10.5px/1.3 var(--sans);white-space:nowrap}
.ml small{display:block;font:500 9.5px/1.3 var(--sans);color:var(--t2)}
.flow{stroke-dasharray:2 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pace{position:relative;margin:6px 10px 2px;border-radius:10px;padding:8px 10px 6px}
.pace svg{display:block;width:100%;height:64px;margin-top:4px}
.note{font:500 10.5px/1.45 var(--sans);color:var(--t2);padding:2px 14px 6px}
.note.c-warn{color:var(--warn)}

/* 工具栏 */
.tb{display:flex;align-items:center;gap:4px;padding:6px 8px;border-top:.5px solid var(--sep);margin-top:4px}
.tb .ib{width:26px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--t2)}
.tb .ib:hover{background:var(--hover)}
.tb .meta{font:500 10px var(--sans);color:var(--t3);margin:0 auto 0 4px;white-space:nowrap}

@media (prefers-reduced-motion:reduce){.flow{animation:none}}
@media (max-width:900px){.duo{grid-template-columns:1fr}}
</style>
</head>

<div class="shell">
  <h1>cswap 菜单栏面板：三种排法</h1>
  <p class="lede">面板沿用 NetHub 的视觉语言：原生毛玻璃、13 / 12 / 10 pt 三级字号、半透明小卡片配细边、底部图标工具栏，浅色和深色同步。菜单栏图标用 Claude App 自带的模板图标，旁边跟一个百分比，和 Claude App 自己的图标区分开。「现在」场景是你两个账号此刻的真实数据，其余场景是示例数据，用来看各种状态长什么样。</p>

  <div class="controls">
    <div class="ctl"><span>版本</span><div class="pick" id="pv"></div></div>
    <div class="ctl"><span>场景</span><div class="pick" id="ps"></div></div>
  </div>

  <div class="vnote"><b id="vt"></b><p id="vd"></p></div>

  <div class="duo">
    <div><div class="cap">浅色菜单栏</div><div class="stage" id="sl"></div></div>
    <div class="dark"><div class="cap">深色菜单栏</div><div class="stage" id="sd"></div></div>
  </div>
</div>

<script>
const ACC=[{bg:'#D97757'},{bg:'#5B8DEF'}];
/* 场景数据。now 为 2026-11-07 06:36 的真实读数，其余为示例 */
const S={
 now:{label:'现在',auto:false,upd:'4 分钟前更新',sessions:[['NetHub','VibeCoding'],['主目录','eric']],
  accts:[
   {name:'alicechen92',mail:'example.com',plan:'Pro 已到期',planW:true,cur:true,loginUntil:'11 月 19 日',h5:{left:71,reset:'10:10',in:'3 时 33 分'},wk:{left:37,reset:'周三 05:00',ideal:56,fast:true,proj:'周一凌晨'}},
   {name:'BobWilliams8810',mail:'example.com',plan:'Free',h5:{left:100,reset:'—',in:'已满'},wk:{left:36,reset:'周二 06:59',ideal:43,fast:false}}],
  login:null},
 near:{label:'快到切换线',auto:true,upd:'刚刚更新',sessions:[['NetHub','VibeCoding'],['主目录','eric']],
  accts:[
   {name:'alicechen92',mail:'example.com',plan:'Pro',cur:true,loginUntil:'11 月 19 日',h5:{left:13,reset:'10:10',in:'1 时 05 分'},wk:{left:22,reset:'周三 05:00',ideal:48,fast:true,proj:'周日晚上'}},
   {name:'BobWilliams8810',mail:'example.com',plan:'Pro',h5:{left:100,reset:'—',in:'已满'},wk:{left:41,reset:'周二 06:59',ideal:43,fast:false}}],
  login:null},
 out:{label:'两个号都用完',auto:true,upd:'1 分钟前更新',sessions:[['NetHub','VibeCoding']],
  accts:[
   {name:'alicechen92',mail:'example.com',plan:'Pro',cur:true,loginUntil:'11 月 19 日',h5:{left:0,reset:'10:10',in:'52 分'},wk:{left:18,reset:'周三 05:00',ideal:40,fast:true}},
   {name:'BobWilliams8810',mail:'example.com',plan:'Pro',h5:{left:46,reset:'09:40',in:'22 分'},wk:{left:0,reset:'周二 06:59',ideal:30,fast:true}}],
  login:null},
 stale:{label:'读不到用量',auto:false,upd:'读取失败，2 分钟后重试',sessions:[['主目录','eric']],
  accts:[
   {name:'alicechen92',mail:'example.com',plan:'Pro',cur:true,loginUntil:'11 月 19 日',h5:{left:71,reset:'10:10',in:'3 时 33 分'},wk:{left:37,reset:'周三 05:00',ideal:56,fast:true}},
   {name:'BobWilliams8810',mail:'example.com',plan:'Free',na:true,h5:{left:null},wk:{left:null}}],
  login:{name:'BobWilliams8810',date:'11 月 9 日'}}
};
/* 结论：当前账号两个窗口里更紧的那个 */
function verdict(sc){
  const a=sc.accts.find(x=>x.cur), o=sc.accts.find(x=>!x.cur);
  const tight=Math.min(a.h5.left,a.wk.left);
  if(tight<=0){const oo=o.h5.left>0&&o.wk.left>0; return oo?{lv:'bad',t:'已用完'}:{lv:'bad',t:'都已用完'}}
  if(tight<=15) return {lv:'warn',t:'快到切换线'};
  if(a.wk.fast) return {lv:'warn',t:'用得偏快'};
  return {lv:'ok',t:'充足'};
}
const col=l=>({ok:'var(--ok)',warn:'var(--warn)',bad:'var(--bad)'}[l]);
const fillCol=(left,base)=>left<=0?'var(--bad)':left<=15?'var(--warn)':base;
const bar=(left,base,ideal)=>`<div class="bar"><i style="width:${Math.max(left,0)}%;background:${fillCol(left,base)}"></i>${ideal!=null?`<u style="left:${ideal}%"></u>`:''}</div>`;
const pct=v=>v==null?'—':`${v}<small>%</small>`;
const ico=(id,s=15)=>`<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`;
function head(sc){
  const a=sc.accts.find(x=>x.cur), v=verdict(sc), i=sc.accts.indexOf(a);
  return `<div class="hd"><span class="av" style="background:${ACC[i].bg}">${a.name[0].toUpperCase()}</span><span class="nm">${a.name}</span><span class="tag ${a.planW?'w':''}">${a.plan}</span><span class="st c-${v.lv}"><i class="b-${v.lv}"></i>${v.t}</span></div>`;
}
function toolbar(sc){
  return `<div class="tb"><button class="ib" aria-label="立即刷新">${ico('i-refresh')}</button><button class="ib" aria-label="添加当前登录的账号">${ico('i-plus')}</button><span class="meta">${sc.upd}</span><button class="ib" aria-label="设置">${ico('i-gear')}</button></div>`;
}
function autoRow(sc){
  return `<div class="row"><span class="ic">${ico('i-auto')}</span><div class="grow"><div class="title">自动切换</div><div class="sub">${sc.auto?'用到 90% 时换到余量最多的号':'已关闭，到线也不会换'}</div></div><span class="sw ${sc.auto?'on':''}" role="switch" aria-checked="${sc.auto}"></span></div>`;
}
function loginNote(sc){return sc.login?`<div class="note c-warn">${sc.login.name} 的登录 ${sc.login.date} 失效，到期前用这个号重新登录一次</div>`:''}
function paceLine(a){
  if(a.wk.left==null) return '';
  if(a.wk.left<=0) return `本周额度已用完，${a.wk.reset} 回满`;
  return a.wk.fast?`比均速快，这时本该还剩 ${a.wk.ideal}%${a.wk.proj?`，照这个速度${a.wk.proj}用完`:''}`:`节奏正常，${a.wk.reset} 回满`;
}

/* ── A：概览卡 ── */
function A(sc){
  const a=sc.accts.find(x=>x.cur), o=sc.accts.find(x=>!x.cur);
  const h5=a.h5.left<=0?`${a.h5.in}后回满`:`${a.h5.reset} 回满`;
  return head(sc)+
  `<div class="stats cardbg" style="grid-template-columns:1.15fr 1fr 1fr"><div><div class="k">5 小时回满</div><div class="v">${a.h5.left>=100?'已满':a.h5.in+'后'}</div></div><div><div class="k">本周回满</div><div class="v">${a.wk.reset}</div></div><div><div class="k">登录有效至</div><div class="v">${a.loginUntil||'—'}</div></div></div>
  <div class="duo2">
   <div class="uc cardbg"><div class="top"><span class="lab">5 小时</span><span class="val">${pct(a.h5.left)}</span></div>${bar(a.h5.left,'var(--accent)')}</div>
   <div class="uc cardbg"><div class="top"><span class="lab">本周</span><span class="val">${pct(a.wk.left)}</span></div>${bar(a.wk.left,'var(--ok)',a.wk.ideal)}</div>
  </div>
  <div class="note" style="padding-top:6px">${paceLine(a)}</div>
  <div class="hair"></div>
  <div class="row"><span class="ic">${ico('i-swap')}</span><div class="grow"><div class="title">换到 ${o.name}</div><div class="sub">${o.na?'用量读不到，最后一次是 2 小时前':`本周剩 ${o.wk.left}%，5 小时剩 ${o.h5.left}%`}</div></div><span class="chev"></span></div>
  ${autoRow(sc)}${loginNote(sc)}
  <div class="hair"></div>
  <div class="th" style="grid-template-columns:1fr 110px"><span>运行中的 Claude Code</span><span>所在文件夹</span></div>
  ${sc.sessions.map(s=>`<div class="tr" style="grid-template-columns:1fr 110px"><span class="ell" style="display:flex;gap:7px;align-items:center"><span style="color:var(--t2);display:grid">${ico('i-term',14)}</span>${s[0]}</span><span class="dim ell">${s[1]}</span></div>`).join('')}
  `+toolbar(sc);
}

/* ── B：账号表 ── */
function B(sc){
  const a=sc.accts.find(x=>x.cur);
  const cols='grid-template-columns:1fr 74px 74px';
  return head(sc)+
  `<div class="pace cardbg"><div class="top" style="display:flex;justify-content:space-between;align-items:baseline"><span class="lab">本周剩余</span><span class="val">${pct(a.wk.left)}</span></div>${bar(a.wk.left,'var(--ok)',a.wk.ideal)}
   <div style="display:flex;justify-content:space-between;font:500 9.5px var(--sans);color:var(--t2);margin-top:5px"><span>${a.wk.fast?`本该剩 ${a.wk.ideal}%`:'节奏正常'}</span><span>${a.wk.reset} 回满</span></div></div>
  <div class="note">${a.wk.fast&&a.wk.proj?`照这个速度${a.wk.proj}用完，比回满早`:(a.h5.left<=0?`5 小时额度已用完，${a.h5.in}后回满`:a.h5.left<=15?`5 小时额度只剩 ${a.h5.left}%，${a.h5.in}后回满`:'')}</div>
  <div class="th" style="${cols}"><span>账号</span><span>5 小时</span><span>本周</span></div>
  ${sc.accts.map((x,i)=>`<div class="tr ${x.cur?'cur':''}" style="${cols}"><span class="ell" style="display:flex;gap:7px;align-items:center"><span class="av" style="width:16px;height:16px;font-size:9px;background:${ACC[i].bg};box-shadow:0 0 0 1px rgba(255,255,255,.6)">${x.name[0].toUpperCase()}</span><span class="ell">${x.name}</span></span>
    ${x.na?`<span class="dim">读不到</span><span class="dim">读不到</span>`:`<span class="mini">${bar(x.h5.left,'var(--accent)')}${x.h5.left}</span><span class="mini">${bar(x.wk.left,'var(--ok)')}${x.wk.left}</span>`}</div>`).join('')}
  <div class="note" style="padding-top:4px">点一行切换；右键可起别名、暂停轮换、移除</div>
  <div class="hair"></div>
  ${autoRow(sc)}${loginNote(sc)}
  `+toolbar(sc);
}

/* ── C：流向图 ── */
function C(sc){
  const a=sc.accts.find(x=>x.cur), o=sc.accts.find(x=>!x.cur), ai=sc.accts.indexOf(a);
  const ys=[30,69,108].slice(0,Math.max(sc.sessions.length,1));
  const sesY=sc.sessions.length===1?[69]:[44,94];
  const accY=ai===0?[44,94]:[94,44];
  const curY=accY[0], othY=accY[1];
  const oLv=o.na?'var(--off)':(Math.min(o.h5.left,o.wk.left)<=0?'var(--bad)':'var(--t3)');
  const aLv=fillCol(Math.min(a.h5.left,a.wk.left),'var(--ok)');
  const lines=sesY.map(y=>`<path d="M66 ${y} C 104 ${y}, 116 69, 140 69" fill="none" stroke="${aLv}" stroke-opacity=".55" stroke-width="1.5"/><circle cx="66" cy="${y}" r="3" fill="${aLv}"/>`).join('');
  return head(sc)+
  `<div class="stats cardbg" style="grid-template-columns:1fr 1fr 1.3fr"><div><div class="k">5 小时剩余</div><div class="v">${a.h5.left}%</div></div><div><div class="k">本周剩余</div><div class="v">${a.wk.left}%</div></div><div><div class="k">本周回满</div><div class="v">${a.wk.reset}</div></div></div>
  <div class="map cardbg">
   <svg viewBox="0 0 300 138" preserveAspectRatio="none">${lines}
    <rect x="140" y="52" width="14" height="34" rx="7" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="1"/>
    <path class="flow" d="M154 69 C 176 69, 182 ${curY}, 200 ${curY}" fill="none" stroke="${aLv}" stroke-width="1.6"/>
    <path d="M154 69 C 176 69, 182 ${othY}, 200 ${othY}" fill="none" stroke="${oLv}" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="200" cy="${curY}" r="3" fill="${aLv}"/><circle cx="200" cy="${othY}" r="3" fill="${oLv}"/>
   </svg>
   ${sc.sessions.map((s,i)=>`<div class="ml" style="left:10px;top:${sesY[i]-14}px">${s[0]}<small>会话</small></div>`).join('')}
   <div class="ml" style="left:125px;top:92px;text-align:center;width:44px;color:var(--accent)">cswap<small style="color:var(--accent)">${sc.auto?'自动':'手动'}</small></div>
   <div class="ml" style="right:10px;top:${curY-14}px;text-align:right">${a.name.slice(0,9)}…<small>在用，本周 ${a.wk.left}%</small></div>
   <div class="ml" style="right:10px;top:${othY-14}px;text-align:right;color:var(--t2)">${o.name.slice(0,9)}…<small>${o.na?'读不到用量':`本周 ${o.wk.left}%`}</small></div>
  </div>
  <div class="note" style="padding-top:4px">${paceLine(a)}</div>
  <div class="hair"></div>
  <div class="row"><span class="ic">${ico('i-swap')}</span><div class="grow"><div class="title">切换账号</div><div class="sub">当前 ${a.name}</div></div><span class="chev"></span></div>
  ${autoRow(sc)}${loginNote(sc)}
  `+toolbar(sc);
}

const V={A:{f:A,t:'A · 概览卡',d:'照 NetHub 主面板的结构：顶部一条数据条，下面两张用量卡（5 小时、本周，本周卡上的竖线是均速位置），然后是换号、自动切换、正在运行的 Claude Code。信息最全，一屏看完。'},
         B:{f:B,t:'B · 账号表',d:'把账号做成 NetHub「活跃进程」那样的表：每行一个账号，两列迷你条，当前账号蓝底高亮，点一行就换。上面只留本周剩余一张卡。账号变多时最好扩展。'},
         C:{f:C,t:'C · 流向图',d:'对应 NetHub 的分流图：左边是正在运行的 Claude Code，中间是 cswap，右边是两个账号，实线连到正在用的那个。换号时线会改连，一眼看出"现在走的是哪个号"。'}};
let cv='A', cs='now';
function render(){
  const sc=S[cs], a=sc.accts.find(x=>x.cur), v=verdict(sc);
  const mbCls=v.lv==='ok'?'':v.lv;
  const tight=Math.min(a.h5.left,a.wk.left);
  for(const id of ['sl','sd']){
    document.getElementById(id).innerHTML=`<div class="wall"></div>
    <div class="menubar"><span class="mb"><svg class="wifi" viewBox="0 0 15 11"><path d="M7.5 10.2 5.6 8.1a2.7 2.7 0 0 1 3.8 0zM3.8 6.3a5.3 5.3 0 0 1 7.4 0l-1 1.1a3.9 3.9 0 0 0-5.4 0zM1.9 4.4a8 8 0 0 1 11.2 0l-1 1a6.6 6.6 0 0 0-9.2 0zM0 2.5a10.7 10.7 0 0 1 15 0l-1 1a9.3 9.3 0 0 0-13 0z" fill="currentColor"/></svg></span>
    <span class="mb cs active ${mbCls}"><span class="tray"></span><span class="mbpct">${tight}%</span></span>
    <span class="mb">11月7日 周六 06:36</span></div>
    <div class="panel">${V[cv].f(sc)}</div>`;
    const st=document.getElementById(id); st.style.height=(st.querySelector('.panel').offsetHeight+70)+'px';
  }
  document.getElementById('vt').textContent=V[cv].t;
  document.getElementById('vd').textContent=V[cv].d;
  document.querySelectorAll('#pv button').forEach(b=>b.classList.toggle('on',b.dataset.k===cv));
  document.querySelectorAll('#ps button').forEach(b=>b.classList.toggle('on',b.dataset.k===cs));
}
document.getElementById('pv').innerHTML=Object.entries(V).map(([k,v])=>`<button data-k="${k}">${v.t}</button>`).join('');
document.getElementById('ps').innerHTML=Object.entries(S).map(([k,v])=>`<button data-k="${k}">${v.label}${k==='now'?'（真实）':''}</button>`).join('');
document.getElementById('pv').onclick=e=>{const k=e.target.dataset.k;if(k){cv=k;render()}};
document.getElementById('ps').onclick=e=>{const k=e.target.dataset.k;if(k){cs=k;render()}};
const q=new URLSearchParams(location.search); if(q.get('v'))cv=q.get('v'); if(q.get('s'))cs=q.get('s');
render();
</script>
</body>
</html>
